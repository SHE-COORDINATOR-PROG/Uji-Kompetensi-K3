<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIGAP K3 — Dashboard Training &amp; Ujian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
<style>
:root{
  --bg:#10151c;
  --bg-panel:#161e28;
  --bg-panel-2:#1b2431;
  --grid-line:rgba(255,255,255,.055);
  --steel:#2c3644;
  --steel-light:#3a4553;
  --amber:#ffb020;
  --amber-dim:#8a6a2c;
  --cyan:#4fd1e8;
  --pass:#2fae66;
  --pass-dim:#1c6e42;
  --fail:#e5484d;
  --fail-dim:#8f2d30;
  --text:#edeff3;
  --text-muted:#8a94a3;
  --text-faint:#5b6472;
  --radius:10px;
  --font-display:'Barlow Condensed',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    linear-gradient(var(--grid-line) 1px,transparent 1px) 0 0/38px 38px,
    linear-gradient(90deg,var(--grid-line) 1px,transparent 1px) 0 0/38px 38px,
    var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--amber);color:#1a1305;}
button{font-family:var(--font-body);cursor:pointer;}
input,select{font-family:var(--font-body);}
a{color:inherit;}

/* ---------- layout shell ---------- */
.shell{display:flex;min-height:100vh;}
.sidebar{
  width:220px;flex:none;
  background:linear-gradient(180deg,#131a23,#0e131a);
  border-right:1px solid var(--steel);
  padding:22px 0 18px;
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;
}
.brand{padding:0 20px 20px;border-bottom:1px solid var(--steel);margin-bottom:14px;}
.brand-logos{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.brand-logos .logo-box{
  width:44px;height:44px;flex:none;background:#fff;border-radius:8px;
  display:flex;align-items:center;justify-content:center;padding:4px;
  box-shadow:0 1px 3px rgba(0,0,0,.35);
}
.brand-logos .logo-box img{max-width:100%;max-height:100%;object-fit:contain;display:block;}
.hazard-rule{height:6px;background:repeating-linear-gradient(135deg,var(--amber) 0 10px,#1a1305 10px 20px);opacity:.85;}
.nav{display:flex;flex-direction:column;gap:2px;padding:14px 12px;}
.nav button{
  all:unset;display:flex;align-items:center;gap:10px;
  padding:11px 12px;border-radius:8px;color:var(--text-muted);
  font-family:var(--font-display);font-size:16px;letter-spacing:.03em;text-transform:uppercase;font-weight:600;
  transition:background .15s,color .15s;
}
.nav button .num{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);}
.nav button:hover{background:var(--bg-panel-2);color:var(--text);}
.nav button.active{background:var(--bg-panel-2);color:var(--amber);box-shadow:inset 3px 0 0 var(--amber);}
.sidebar-foot{margin-top:auto;padding:14px 20px 0;border-top:1px solid var(--steel);font-size:11px;color:var(--text-faint);line-height:1.6;}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  padding:18px 30px;border-bottom:1px solid var(--steel);
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  background:rgba(19,26,35,.5);backdrop-filter:blur(6px);position:sticky;top:0;z-index:5;
}
.topbar h1{font-family:var(--font-display);font-size:26px;font-weight:700;letter-spacing:.02em;margin:0;text-transform:uppercase;}
.topbar .sub{font-size:12.5px;color:var(--text-muted);margin-top:2px;}
.view{padding:26px 30px 60px;max-width:1320px;}

/* ---------- generic components ---------- */
.eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);margin:0 0 6px;}
.panel{background:var(--bg-panel);border:1px solid var(--steel);border-radius:var(--radius);padding:20px;}
.grid{display:grid;gap:18px;}
.kpi-row{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));}
.kpi{background:var(--bg-panel);border:1px solid var(--steel);border-radius:var(--radius);padding:16px 18px;position:relative;overflow:hidden;}
.kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--amber);}
.kpi .lbl{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;}
.kpi .val{font-family:var(--font-display);font-size:36px;font-weight:700;margin-top:4px;}
.kpi.pass::before{background:var(--pass);}
.kpi.fail::before{background:var(--fail);}
.kpi .val.pass-c{color:var(--pass);}
.kpi .val.fail-c{color:var(--fail);}

.btn{
  border:1px solid var(--steel-light);background:var(--bg-panel-2);color:var(--text);
  padding:9px 16px;border-radius:7px;font-size:13px;font-weight:600;
  display:inline-flex;align-items:center;gap:7px;transition:border-color .15s,background .15s;
}
.btn:hover{border-color:var(--amber);}
.btn-primary{background:var(--amber);color:#1a1305;border-color:var(--amber);}
.btn-primary:hover{background:#ffc75c;}
.btn-ghost{background:transparent;}
.btn:disabled{opacity:.4;cursor:not-allowed;}

/* stamp */
.stamp{
  display:inline-block;font-family:var(--font-display);font-weight:800;font-size:13px;
  letter-spacing:.12em;text-transform:uppercase;padding:5px 12px;border-radius:4px;
  border:2px solid currentColor;transform:rotate(-4deg);position:relative;
}
.stamp::after{content:'';position:absolute;inset:2px;border:1px dashed currentColor;border-radius:2px;opacity:.5;}
.stamp.pass{color:var(--pass);}
.stamp.fail{color:var(--fail);}

/* ---------- materi ---------- */
.materi-grid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));}
.materi-card{background:var(--bg-panel);border:1px solid var(--steel);border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:border-color .15s,transform .15s;}
.materi-card:hover{border-color:var(--amber);transform:translateY(-2px);}
.materi-card .ic{width:38px;height:38px;border-radius:8px;background:var(--bg-panel-2);display:flex;align-items:center;justify-content:center;font-size:19px;}
.materi-card h3{font-family:var(--font-display);font-size:20px;margin:0;text-transform:uppercase;letter-spacing:.02em;}
.materi-card p{font-size:12.5px;color:var(--text-muted);margin:0;line-height:1.5;}
.materi-card .reg{font-family:var(--font-mono);font-size:10.5px;color:var(--cyan);margin-top:auto;}

.materi-detail h2{font-family:var(--font-display);font-size:32px;text-transform:uppercase;margin:4px 0 2px;}
.materi-detail .reg-tag{display:inline-block;font-family:var(--font-mono);font-size:11px;color:var(--cyan);background:rgba(79,209,232,.08);border:1px solid rgba(79,209,232,.3);padding:4px 10px;border-radius:20px;margin-bottom:18px;}
.materi-body{display:grid;grid-template-columns:1fr;gap:14px;}
.materi-block{background:var(--bg-panel);border:1px solid var(--steel);border-left:3px solid var(--amber);border-radius:8px;padding:14px 18px;}
.materi-block h4{font-family:var(--font-display);font-size:16px;text-transform:uppercase;letter-spacing:.04em;margin:0 0 6px;color:var(--amber);}
.materi-block ul{margin:0;padding-left:18px;}
.materi-block li{font-size:13.5px;line-height:1.65;color:#d7dbe2;margin-bottom:3px;}
.materi-block p{font-size:13.5px;line-height:1.65;color:#d7dbe2;margin:0;}
.back-link{font-family:var(--font-mono);font-size:12px;color:var(--text-muted);display:inline-flex;align-items:center;gap:6px;margin-bottom:14px;}
.back-link:hover{color:var(--amber);}

/* ---------- ujian ---------- */
.exam-card{background:var(--bg-panel);border:1px solid var(--steel);border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;gap:10px;}
.exam-card h3{font-family:var(--font-display);font-size:19px;text-transform:uppercase;margin:0;}
.exam-card .meta{font-size:12px;color:var(--text-muted);}
.link-row{display:flex;gap:6px;align-items:center;background:var(--bg-panel-2);border:1px solid var(--steel);border-radius:6px;padding:6px 8px;}
.link-row input{flex:1;background:transparent;border:none;color:var(--text-faint);font-family:var(--font-mono);font-size:10.5px;outline:none;}
.exam-card .actions{display:flex;gap:8px;margin-top:auto;}

.form-box{max-width:440px;background:var(--bg-panel);border:1px solid var(--steel);border-radius:var(--radius);padding:24px;}
.form-box label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);margin:14px 0 6px;}
.form-box input{width:100%;background:var(--bg-panel-2);border:1px solid var(--steel-light);border-radius:7px;padding:10px 12px;color:var(--text);font-size:14px;outline:none;}
.form-box input:focus{border-color:var(--amber);}

.qcard{background:var(--bg-panel);border:1px solid var(--steel);border-radius:var(--radius);padding:24px;max-width:640px;}
.qcard .qmeta{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);display:flex;justify-content:space-between;margin-bottom:10px;}
.qcard .qtext{font-size:17px;font-weight:600;line-height:1.5;margin-bottom:18px;}
.opt{display:flex;gap:10px;align-items:flex-start;background:var(--bg-panel-2);border:1px solid var(--steel);border-radius:8px;padding:11px 14px;margin-bottom:9px;transition:border-color .15s,background .15s;}
.opt:hover{border-color:var(--amber-dim);}
.opt.selected{border-color:var(--amber);background:rgba(255,176,32,.08);}
.opt input{margin-top:3px;accent-color:var(--amber);}
.opt label{font-size:13.5px;line-height:1.5;cursor:pointer;flex:1;}
.progress-bar{height:5px;background:var(--steel);border-radius:3px;overflow:hidden;margin-bottom:16px;}
.progress-bar > div{height:100%;background:var(--amber);transition:width .2s;}

.result-box{max-width:480px;background:var(--bg-panel);border:1px solid var(--steel);border-radius:var(--radius);padding:30px;text-align:center;}
.result-box .score{font-family:var(--font-display);font-size:64px;font-weight:800;margin:14px 0;}
.result-box .score.pass-c{color:var(--pass);}
.result-box .score.fail-c{color:var(--fail);}

/* ---------- charts (isometric 3D bars) ---------- */
.chart-title{font-family:var(--font-display);font-size:18px;text-transform:uppercase;letter-spacing:.03em;margin:0 0 2px;}
.chart-sub{font-size:11.5px;color:var(--text-muted);margin:0 0 20px;}
.iso-wrap{overflow-x:auto;padding-bottom:6px;}
.iso-chart{display:flex;align-items:flex-end;gap:38px;height:210px;padding:36px 14px 0;min-width:max-content;}
.iso-col{display:flex;flex-direction:column;align-items:center;gap:10px;}
.iso-bar{position:relative;width:46px;--h:10px;}
.iso-bar .bv{font-family:var(--font-mono);font-size:12px;color:var(--text);position:absolute;left:50%;top:-20px;transform:translateX(-50%);white-space:nowrap;}
.iso-bar .front{position:absolute;left:0;bottom:0;width:46px;height:var(--h);background:linear-gradient(180deg,var(--c1),var(--c2));border-radius:2px 2px 0 0;}
.iso-bar .side{position:absolute;left:44px;bottom:0;width:13px;height:var(--h);background:var(--c3);transform:skewY(-40deg);transform-origin:top left;border-radius:0 2px 0 0;}
.iso-bar .top{position:absolute;left:0;bottom:var(--h);width:46px;height:13px;background:var(--c4);transform:skewX(-40deg) translateY(0px);transform-origin:bottom left;}
.iso-label{font-family:var(--font-display);font-size:13px;text-transform:uppercase;letter-spacing:.02em;color:var(--text-muted);text-align:center;max-width:96px;line-height:1.15;}
.legend{display:flex;gap:18px;margin-top:6px;flex-wrap:wrap;}
.legend .li{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-muted);}
.legend .sw{width:11px;height:11px;border-radius:3px;}

/* ---------- filters & table ---------- */
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:18px;}
.filters .fld{display:flex;flex-direction:column;gap:5px;}
.filters label{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);}
.filters input,.filters select{background:var(--bg-panel-2);border:1px solid var(--steel-light);border-radius:6px;padding:8px 10px;color:var(--text);font-size:12.5px;outline:none;min-width:140px;}
.filters input:focus,.filters select:focus{border-color:var(--amber);}

table.data-table{width:100%;border-collapse:collapse;font-size:12.5px;}
table.data-table thead th{
  text-align:left;font-family:var(--font-display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--amber);border-bottom:1px solid var(--steel);padding:9px 12px;white-space:nowrap;
}
table.data-table tbody td{padding:9px 12px;border-bottom:1px solid var(--grid-line);font-family:var(--font-mono);white-space:nowrap;}
table.data-table tbody tr:hover{background:var(--bg-panel-2);}
.badge{display:inline-block;font-family:var(--font-body);font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.03em;}
.badge.pass{color:var(--pass);background:rgba(47,174,102,.12);border:1px solid var(--pass-dim);}
.badge.fail{color:var(--fail);background:rgba(229,72,77,.12);border:1px solid var(--fail-dim);}
.badge.muted{color:var(--text-faint);background:transparent;border:1px solid var(--steel);}
.empty{color:var(--text-faint);font-size:12.5px;padding:30px;text-align:center;}

.section-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px;}

@media (max-width:860px){
  .shell{flex-direction:column;}
  .sidebar{position:relative;width:100%;height:auto;flex-direction:row;overflow-x:auto;padding:14px;}
  .brand,.sidebar-foot,.hazard-rule{display:none;}
  .nav{flex-direction:row;padding:0;}
  .view{padding:18px 16px 50px;}
  .topbar{padding:14px 16px;}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logos">
        <div class="logo-box"><img src="assets/logo-kpp.png" alt="KPP Mining"></div>
        <div class="logo-box"><img src="assets/logo-ciss.png" alt="CISS"></div>
        <div class="logo-box"><img src="assets/logo-asto.png" alt="ASTO"></div>
      </div>
    </div>
    <div class="hazard-rule"></div>
    <nav class="nav" id="nav">
      <button data-route="dashboard"><span>📊</span>Dashboard</button>
      <button data-route="materi"><span>📘</span>Materi</button>
      <button data-route="ujian"><span>📝</span>Soal Ujian</button>
    </nav>
    <div class="sidebar-foot">Data ujian tersimpan bersama (shared) &amp; terlihat oleh semua pengguna aplikasi ini.</div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div>
        <h1 id="page-title">Dashboard</h1>
        <div class="sub" id="page-sub">Ringkasan pencapaian pelatihan &amp; ujian K3</div>
      </div>
      <div style="display:flex;gap:10px;">
        <button class="btn" id="btn-export-word">📄 Export ke Word</button>
        <button class="btn" id="btn-export">⇩ Export ke PPT</button>
      </div>
    </header>
    <main class="view" id="view-root"></main>
  </div>
</div>

<script>
/* ============================================================
   DATA: kategori materi + bank soal (10 soal / kategori)
   ============================================================ */
const CATEGORIES = [
{
  id:'hand-finger', name:'Hand & Finger Injury', icon:'🖐️',
  reg:'Permenaker No. 38/2016 · Permenaker No. 01/1988 (APD)',
  ringkas:'Pencegahan cedera terjepit, tersayat & tergilas pada tangan dan jari saat bekerja dengan mesin/alat.',
  materi:[
    {h:'Definisi & Bahaya Utama', items:[
      'Cedera tangan/jari umumnya terjadi akibat titik jepit (pinch point) pada mesin berputar, alat potong, dan proses pengepresan.',
      'Bentuk cedera: terjepit, tersayat, tergilas, tergores, hingga amputasi jari.',
      'Perhiasan (cincin, gelang) meningkatkan risiko cedera serius (degloving) saat tersangkut mesin berputar.']},
    {h:'Dasar Regulasi', items:[
      'Permenaker No. 38 Tahun 2016 tentang K3 Pesawat Tenaga dan Produksi — mewajibkan pengaman pada titik operasi mesin.',
      'Permenaker No. 01/1988 tentang Alat Pelindung Diri (APD) — kewajiban penyediaan & penggunaan sarung tangan sesuai jenis bahaya.']},
    {h:'Pengendalian & Pencegahan', items:[
      'Hierarki pengendalian: eliminasi/substitusi (otomasi) → engineering control (machine guarding, two-hand control) → administratif (SOP, LOTO) → APD.',
      'Lockout-Tagout (LOTO) wajib dilakukan sebelum perbaikan/maintenance mesin untuk mencegah mesin bergerak tiba-tiba.',
      'Gunakan sarung tangan sesuai jenis pekerjaan (anti-sayat/kevlar untuk logam tajam, tahan panas untuk area panas).',
      'Inspeksi rutin alat tangan (hand tools) — ganti alat yang tumpul/rusak.']}
  ],
  soal:[
    {q:'Apa yang dimaksud dengan "pinch point" dalam konteks keselamatan kerja?',o:['Titik dimana dua bagian mesin bertemu dan dapat menjepit anggota tubuh','Titik pengisian bahan bakar','Titik pengukuran tekanan','Titik pemasangan APD'],a:0},
    {q:'Pengaman yang dipasang pada titik operasi mesin untuk mencegah tangan operator masuk ke area berbahaya disebut?',o:['Emergency stop','Point of operation guard','Interlock listrik','APD tangan'],a:1},
    {q:'Dasar hukum utama yang mengatur K3 pesawat tenaga dan produksi termasuk pengaman mesin di Indonesia adalah?',o:['Permenaker No. 12/2015','Permenaker No. 38/2016','Permenaker No. 8/2020','UU No. 13/2003'],a:1},
    {q:'Jenis sarung tangan yang tepat untuk pekerjaan memotong logam tajam adalah?',o:['Sarung tangan katun tipis','Sarung tangan kevlar/anti-sayat','Sarung tangan lateks medis','Tanpa sarung tangan agar lebih presisi'],a:1},
    {q:'Prosedur yang wajib dilakukan sebelum perbaikan/maintenance mesin untuk mencegah mesin tiba-tiba bergerak dan melukai tangan adalah?',o:['Lockout-Tagout (LOTO)','Membersihkan mesin','Mengisi checklist harian','Memberi pelumas'],a:0},
    {q:'Cincin/perhiasan sebaiknya dilepas saat bekerja dengan mesin berputar karena berisiko?',o:['Menghambat pekerjaan','Tersangkut dan menyebabkan cedera jari serius (degloving)','Membuat tangan kotor','Tidak ada risiko berarti'],a:1},
    {q:'Tindakan pertama saat terjadi cedera jari akibat terjepit mesin adalah?',o:['Melanjutkan pekerjaan','Amankan area, matikan mesin, dan segera berikan pertolongan pertama','Membiarkan korban bekerja sendiri','Menunggu shift berakhir'],a:1},
    {q:'Pengendalian risiko cedera tangan yang paling efektif menurut hierarki pengendalian bahaya adalah?',o:['APD','Eliminasi/substitusi bahaya seperti otomasi proses','Rambu peringatan','Pelatihan saja'],a:1},
    {q:'Apa fungsi utama "two-hand control" pada mesin press?',o:['Mempercepat produksi','Memastikan kedua tangan operator berada di tombol kontrol dan jauh dari titik jepit','Menghemat energi','Mengurangi kebisingan'],a:1},
    {q:'Cedera jari akibat penggunaan alat tangan yang tumpul/rusak dapat dicegah dengan?',o:['Tetap digunakan sampai rusak total','Inspeksi rutin & penggantian alat yang aus/rusak','Menggunakan lebih banyak tenaga','Mengabaikan kondisi alat'],a:1}
  ]
},
{
  id:'power-tools', name:'Power Tools Safety', icon:'🛠️',
  reg:'Permenaker No. 38/2016 (K3 Pesawat Tenaga & Produksi)',
  ringkas:'Penggunaan aman perkakas listrik/bertenaga: gerinda, bor, gergaji mesin, dan alat portable lainnya.',
  materi:[
    {h:'Bahaya Utama', items:[
      'Terjepit/terpotong mata alat, tersengat listrik dari kabel rusak, terlempar percikan/serpihan, kickback pada gergaji mesin.',
      'Paparan getaran (vibration) jangka panjang dapat menyebabkan Hand-Arm Vibration Syndrome (HAVS).']},
    {h:'Dasar Regulasi', items:[
      'Permenaker No. 38 Tahun 2016 tentang K3 Pesawat Tenaga dan Produksi — persyaratan pemeriksaan, pengujian & sertifikasi kelayakan alat.']},
    {h:'Prosedur Aman', items:[
      'Lakukan pemeriksaan visual (pre-use inspection) sebelum alat digunakan — kabel, guard, mata alat.',
      'Gunakan APD: kacamata pelindung, sarung tangan sesuai jenis pekerjaan, pelindung telinga bila bising.',
      'Guard/pelindung mata pisau tidak boleh dilepas atau dimodifikasi tanpa izin.',
      'Matikan & putus sumber daya sebelum mengganti mata bor/mata potong.',
      'Simpan power tools di tempat kering, aman, dan sesuai tempatnya setelah digunakan.']}

    {q:'Peralatan yang wajib disiapkan untuk menangani tumpahan (spill) oli/B3 secara cepat adalah?',o:['Spill kit','Alat pemadam kebakaran saja','Tidak perlu peralatan khusus','Sapu biasa'],a:0},
    {q:'Tindakan yang dilarang terkait limbah cair hasil kegiatan kerja adalah?',o:['Mengolah sesuai baku mutu','Membuang langsung ke sungai/badan air tanpa pengolahan','Menampung di kolam pengendapan','Melaporkan ke pihak berwenang'],a:1},
    {q:'Kegiatan mengembalikan fungsi lahan bekas tambang dengan penanaman kembali disebut?',o:['Reklamasi dan revegetasi','Eksplorasi','Eksploitasi','Deforestasi'],a:0},
    {q:'Regulasi teknis yang mengatur pengelolaan lingkungan pada kegiatan pertambangan di Indonesia adalah?',o:['Kepmen ESDM No. 1827 K/30/MEM/2018','Permenaker No. 12/2015','Permenaker No. 9/2016','UU No. 1/1970'],a:0},
    {q:'Pemantauan kualitas air, udara, dan tanah di sekitar area kerja dilakukan untuk?',o:['Formalitas semata','Memastikan dampak lingkungan masih dalam batas baku mutu yang diizinkan','Tidak ada tujuan khusus','Menambah pekerjaan administrasi'],a:1},
    {q:'PP No. 22 Tahun 2021 mengatur tentang?',o:['Penyelenggaraan Perlindungan dan Pengelolaan Lingkungan Hidup','K3 Listrik','K3 Pesawat Angkat','Pengupahan'],a:0},
    {q:'Salah satu dampak pencemaran lingkungan akibat kegiatan kerja yang tidak dikelola dengan baik adalah?',o:['Tidak ada dampak','Pencemaran air, tanah, dan udara di sekitar area kerja','Meningkatkan produktivitas','Menambah nilai estetika'],a:1}
  ]
}
];
const PASSING_SCORE = 90;

/* ============================================================
   STATE & STORAGE (Neon Postgres via /api/records, hosted on Vercel)
   ============================================================ */
let RECORDS = [];
let examSession = null; // {catId, nama, nrp, idx, answers[]}

function catById(id){ return CATEGORIES.find(c=>c.id===id); }

async function loadRecords(){
  try{
    const res = await fetch('/api/records');
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    RECORDS = Array.isArray(data) ? data : [];
  }catch(e){ console.error('Gagal memuat data dari server:', e); RECORDS = []; }
}
async function postRecord(rec){
  try{
    const res = await fetch('/api/records', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(rec)
    });
    if(!res.ok) throw new Error('HTTP '+res.status);
  }catch(e){
    console.error('Gagal menyimpan ke server:', e);
    alert('Hasil ujian gagal disimpan ke server. Periksa koneksi internet, lalu coba kirim ulang.');
  }
}

/* ============================================================
   ROUTER
   ============================================================ */
function parseHash(){
  const h = location.hash.replace(/^#\/?/, '');
  const parts = h.split('/').filter(Boolean);
  return { route: parts[0] || 'dashboard', arg: parts[1] || null };
}
function go(route, arg){ location.hash = arg ? `#${route}/${arg}` : `#${route}`; }

window.addEventListener('hashchange', render);
window.addEventListener('DOMContentLoaded', async ()=>{
  await loadRecords();
  render();
});

document.getElementById('nav').addEventListener('click', e=>{
  const btn = e.target.closest('button[data-route]');
  if(btn) go(btn.dataset.route);
});
document.getElementById('btn-export').addEventListener('click', exportPPT);
document.getElementById('btn-export-word').addEventListener('click', exportWord);

function setActiveNav(route){
  document.querySelectorAll('#nav button').forEach(b=>{
    b.classList.toggle('active', b.dataset.route===route);
  });
}

function render(){
  const {route, arg} = parseHash();
  setActiveNav(route === 'materi' || route==='ujian' ? route : 'dashboard');
  const titleEl = document.getElementById('page-title');
  const subEl = document.getElementById('page-sub');
  const root = document.getElementById('view-root');
  root.innerHTML = '';

  if(route === 'materi'){
    if(arg){ titleEl.textContent='Materi'; subEl.textContent='Modul pelatihan K3'; root.appendChild(renderMateriDetail(arg)); }
    else{ titleEl.textContent='Menu Materi'; subEl.textContent='Modul pelatihan pencegahan cedera kerja & pekerjaan berisiko tinggi'; root.appendChild(renderMateriList()); }
  } else if(route === 'ujian'){
    if(arg){ titleEl.textContent='Soal Ujian'; subEl.textContent=catById(arg)? catById(arg).name : ''; root.appendChild(renderUjianFlow(arg)); }
    else{ titleEl.textContent='Menu Soal'; subEl.textContent='Ujian per kategori — 10 soal, standar kelulusan nilai ≥ '+PASSING_SCORE; root.appendChild(renderUjianList()); }
  } else {
    titleEl.textContent='Dashboard'; subEl.textContent='Ringkasan pencapaian pelatihan & ujian K3';
    root.appendChild(renderDashboard());
  }
}

      <h3>${c.name}</h3>

   UJIAN VIEWS

function renderUjianList(){
  const wrap = document.createElement('div');
  const grid = document.createElement('div');
  grid.className='grid materi-grid';
  CATEGORIES.forEach(c=>{
    const link = location.origin + location.pathname + '#ujian/' + c.id;
    const card = document.createElement('div');
    card.className='exam-card';
    card.innerHTML = `
      <h3>${c.icon} ${c.name}</h3>
      <div class="meta">10 soal · kelulusan ≥ ${PASSING_SCORE}</div>
      <div class="link-row"><input readonly value="${link}"><button class="btn btn-ghost copy-btn" style="padding:6px 10px;">Salin</button></div>
      <div class="actions">
        <button class="btn btn-primary start-btn" style="flex:1;">Mulai Ujian</button>
      </div>`;
    card.querySelector('.copy-btn').addEventListener('click', (e)=>{
      e.stopPropagation();
      navigator.clipboard?.writeText(link).then(()=>{
        const b=e.target; const old=b.textContent; b.textContent='Tersalin ✓'; setTimeout(()=>b.textContent=old,1400);
      }).catch(()=>{ card.querySelector('.link-row input').select(); });
    });
    card.querySelector('.start-btn').addEventListener('click', ()=>go('ujian', c.id));
    grid.appendChild(card);
  });
  wrap.appendChild(grid);
  return wrap;
}

function renderUjianFlow(id){
  const c = catById(id);
  const wrap = document.createElement('div');
  if(!c){ wrap.innerHTML='<div class="empty">Ujian tidak ditemukan.</div>'; return wrap; }

  if(!examSession || examSession.catId !== id || examSession.done){
    examSession = {catId:id, nama:'', nrp:'', idx:0, answers:new Array(c.soal.length).fill(null), started:false, done:false, score:null};
  }

  if(!examSession.started){
    wrap.appendChild(renderExamIntro(c));
  } else if(!examSession.done){
    wrap.appendChild(renderExamQuestion(c));
  } else {
    wrap.appendChild(renderExamResult(c));
  }
  return wrap;
}

function renderExamIntro(c){
  const box = document.createElement('div');
  box.className='form-box';
  box.innerHTML = `
    <div class="eyebrow">${c.reg}</div>
    <h2 style="font-family:var(--font-display);font-size:26px;margin:0 0 6px;text-transform:uppercase;">${c.icon} ${c.name}</h2>
    <p style="font-size:12.5px;color:var(--text-muted);margin:0;">10 soal pilihan ganda · Nilai kelulusan minimal <b style="color:var(--amber)">${PASSING_SCORE}</b></p>
    <label>Nama Peserta</label>
    <input type="text" id="in-nama" placeholder="Nama lengkap">
    <label>NRP</label>
    <input type="text" id="in-nrp" placeholder="Nomor Register Pegawai">
    <button class="btn btn-primary" id="btn-start" style="margin-top:20px;width:100%;justify-content:center;">Mulai Ujian →</button>
    <div id="err" style="color:var(--fail);font-size:12px;margin-top:8px;"></div>
  `;
  box.querySelector('#btn-start').addEventListener('click', ()=>{
    const nama = box.querySelector('#in-nama').value.trim();
    const nrp = box.querySelector('#in-nrp').value.trim();
    if(!nama || !nrp){ box.querySelector('#err').textContent = 'Nama dan NRP wajib diisi.'; return; }
    examSession.nama = nama; examSession.nrp = nrp; examSession.started = true;
    render();
  });
  return box;
}

function renderExamQuestion(c){
  const i = examSession.idx;
  const q = c.soal[i];
  const box = document.createElement('div');
  box.className='qcard';
  const pct = Math.round((i/(c.soal.length))*100);
  box.innerHTML = `
    <div class="qmeta"><span>SOAL ${i+1} / ${c.soal.length}</span><span>${examSession.nama.toUpperCase()} · ${examSession.nrp}</span></div>
    <div class="progress-bar"><div style="width:${pct}%"></div></div>
    <div class="qtext">${q.q}</div>
    <div class="opts">
      ${q.o.map((opt,oi)=>`
        <div class="opt ${examSession.answers[i]===oi?'selected':''}" data-oi="${oi}">
          <input type="radio" name="opt" ${examSession.answers[i]===oi?'checked':''}>
          <label>${opt}</label>
        </div>`).join('')}
    </div>
    <div style="display:flex;justify-content:space-between;margin-top:18px;">
      <button class="btn" id="btn-prev" ${i===0?'disabled':''}>← Sebelumnya</button>
      <button class="btn btn-primary" id="btn-next" ${examSession.answers[i]===null?'disabled':''}>${i===c.soal.length-1?'Selesai & Kirim':'Berikutnya →'}</button>
    </div>
  `;
  box.querySelectorAll('.opt').forEach(el=>{
    el.addEventListener('click', ()=>{
      examSession.answers[i] = parseInt(el.dataset.oi,10);
      render();
    });
  });
  box.querySelector('#btn-prev')?.addEventListener('click', ()=>{ examSession.idx--; render(); });
  box.querySelector('#btn-next')?.addEventListener('click', async ()=>{
    if(i === c.soal.length-1){ await finishExam(c); render(); }
    else{ examSession.idx++; render(); }
  });
  return box;
}

async function finishExam(c){
  let correct = 0;
  c.soal.forEach((q,idx)=>{ if(examSession.answers[idx]===q.a) correct++; });
  const score = Math.round((correct/c.soal.length)*100);
  const lulus = score >= PASSING_SCORE;
  const rec = {
    id: 'r_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
    nama: examSession.nama, nrp: examSession.nrp,
    kategoriId: c.id, kategoriNama: c.name,
    tanggal: new Date().toISOString().slice(0,10),
    skor: score, lulus
  };
  RECORDS.push(rec);
  await postRecord(rec);
  examSession.done = true; examSession.score = score; examSession.lulus = lulus;
}

function renderExamResult(c){
  const box = document.createElement('div');
  box.className='result-box';
  const lulus = examSession.lulus;
  box.innerHTML = `
    <div class="eyebrow">${c.name}</div>
    <div class="score ${lulus?'pass-c':'fail-c'}">${examSession.score}</div>
    <div class="stamp ${lulus?'pass':'fail'}">${lulus?'LULUS':'TIDAK LULUS'}</div>
    <p style="color:var(--text-muted);font-size:13px;margin-top:18px;">
      ${examSession.nama} (${examSession.nrp}) — standar kelulusan ≥ ${PASSING_SCORE}.
      ${lulus?'Selamat, Anda dinyatakan kompeten pada materi ini.':'Silakan pelajari kembali materi dan ulangi ujian.'}
    </p>
    <div style="display:flex;gap:10px;justify-content:center;margin-top:18px;">
      ${!lulus?`<button class="btn btn-primary" id="btn-retake">Ulangi Ujian</button>`:''}
      <button class="btn" id="btn-back-materi">Kembali ke Menu Soal</button>
    </div>
  `;
  box.querySelector('#btn-retake')?.addEventListener('click', ()=>{
    examSession = null; render();
  });
  box.querySelector('#btn-back-materi').addEventListener('click', ()=>{
    examSession = null; go('ujian');
  });
  return box;
}

/* ============================================================
   DASHBOARD: koreksi otomatis hasil retake + charts + table
   ============================================================ */
function computeCounted(records){
  // group by nama+nrp+kategori (lowercase trim)
  const groups = {};
  records.forEach(r=>{
    const key = (r.nama.trim().toLowerCase())+'|'+(r.nrp.trim().toLowerCase())+'|'+r.kategoriId;
    (groups[key] = groups[key] || []).push(r);
  });
  const countedIds = new Set();
  Object.values(groups).forEach(list=>{
    const passed = list.filter(r=>r.skor>=PASSING_SCORE);
    if(passed.length){
      // ambil nilai lulus tertinggi -> yang dihitung ke chart pencapaian
      passed.sort((a,b)=>b.skor-a.skor);
      countedIds.add(passed[0].id);
    } else {
      // belum pernah lulus -> hitung upaya terakhir sebagai "tidak lulus"
      list.sort((a,b)=> a.tanggal.localeCompare(b.tanggal));
      countedIds.add(list[list.length-1].id);
    }
  });
  return countedIds;
}

function isoBar(value,max,label,colorSet,valueLabel){
  const h = Math.max(6, Math.round((value/Math.max(max,1))*160));
  return `<div class="iso-col">
    <div class="iso-bar" style="--h:${h}px;--c1:${colorSet[0]};--c2:${colorSet[1]};--c3:${colorSet[2]};--c4:${colorSet[3]};">
      <div class="bv">${valueLabel!==undefined?valueLabel:value}</div>
      <div class="top"></div>
      <div class="side"></div>
      <div class="front"></div>
    </div>
    <div class="iso-label">${label}</div>
  </div>`;
}

const AMBER_SET=['#ffcf70','#ffb020','#8a5c10','#ffe1a3'];
const PASS_SET=['#5fd394','#2fae66','#155c35','#a6ecc4'];
const FAIL_SET=['#f28b8e','#e5484d','#7a1f22','#f7c2c3'];

function renderDashboard(){
  const wrap = document.createElement('div');

  const countedIds = computeCounted(RECORDS);

  // ---- filters state (persisted on element via data attrs is simplest: use closures) ----
  const state = { from:'', to:'', kategori:'', status:'' };

  const filtersEl = document.createElement('div');
  filtersEl.className='panel';
  filtersEl.style.marginBottom='18px';
  filtersEl.innerHTML = `
    <div class="filters">
      <div class="fld"><label>Dari Tanggal</label><input type="date" id="f-from"></div>
      <div class="fld"><label>Sampai Tanggal</label><input type="date" id="f-to"></div>
      <div class="fld"><label>Jenis Soal</label>
        <select id="f-kat"><option value="">Semua Kategori</option>${CATEGORIES.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select>
      </div>
      <div class="fld"><label>Status</label>
        <select id="f-status"><option value="">Semua Status</option><option value="lulus">Lulus</option><option value="tidak">Tidak Lulus</option></select>
      </div>
      <div class="fld"><label>&nbsp;</label><button class="btn" id="f-reset">Reset Filter</button></div>
    </div>`;
  wrap.appendChild(filtersEl);

  const contentEl = document.createElement('div');
  wrap.appendChild(contentEl);

  function getFiltered(){
    return RECORDS.filter(r=>{
      if(state.from && r.tanggal < state.from) return false;
      if(state.to && r.tanggal > state.to) return false;
      if(state.kategori && r.kategoriId !== state.kategori) return false;
      if(state.status === 'lulus' && !r.lulus) return false;
      if(state.status === 'tidak' && r.lulus) return false;
      return true;
    });
  }

  function draw(){
    const filtered = getFiltered();
    const countedFiltered = computeCounted(filtered);
    const counted = filtered.filter(r=>countedFiltered.has(r.id));
    const totalLulus = counted.filter(r=>r.lulus).length;
    const totalTidak = counted.filter(r=>!r.lulus).length;
    const totalPeserta = new Set(filtered.map(r=>r.nama.trim().toLowerCase()+'|'+r.nrp.trim().toLowerCase())).size;
    const pctLulus = counted.length? Math.round((totalLulus/counted.length)*100) : 0;
    const maxOverall = Math.max(totalLulus, totalTidak, 1);

    const perKat = CATEGORIES.map(c=>{
      const list = counted.filter(r=>r.kategoriId===c.id);
      return { c, lulus:list.filter(r=>r.lulus).length, tidak:list.filter(r=>!r.lulus).length };
    });
    const maxKat = Math.max(1, ...perKat.map(p=>Math.max(p.lulus,p.tidak)));

    contentEl.innerHTML = '';

    // KPI cards
    const kpiGrid = document.createElement('div');
    kpiGrid.className='grid kpi-row';
    kpiGrid.style.marginBottom='22px';
    kpiGrid.innerHTML = `
      <div class="kpi"><div class="lbl">Total Peserta</div><div class="val">${totalPeserta}</div></div>
      <div class="kpi"><div class="lbl">Ujian Terhitung</div><div class="val">${counted.length}</div></div>
      <div class="kpi pass"><div class="lbl">Lulus</div><div class="val pass-c">${totalLulus}</div></div>
      <div class="kpi fail"><div class="lbl">Tidak Lulus</div><div class="val fail-c">${totalTidak}</div></div>
      <div class="kpi"><div class="lbl">% Kelulusan</div><div class="val" style="color:var(--amber)">${pctLulus}%</div></div>`;
    contentEl.appendChild(kpiGrid);

    // Chart 1: pencapaian keseluruhan
    const chart1 = document.createElement('div');
    chart1.className='panel'; chart1.style.marginBottom='18px';
    chart1.innerHTML = `
      <div class="chart-title">Pencapaian Kelulusan Keseluruhan</div>
      <div class="chart-sub">Hasil terkoreksi otomatis — nilai ujian ulang di bawah ${PASSING_SCORE} tidak dihitung bila peserta sudah lulus.</div>
      <div class="iso-wrap"><div class="iso-chart" id="chart1"></div></div>
      <div class="legend"><div class="li"><span class="sw" style="background:var(--pass)"></span>Lulus</div><div class="li"><span class="sw" style="background:var(--fail)"></span>Tidak Lulus</div></div>`;
    contentEl.appendChild(chart1);
    chart1.querySelector('#chart1').innerHTML =
      isoBar(totalLulus, maxOverall, 'LULUS', PASS_SET) +
      isoBar(totalTidak, maxOverall, 'TIDAK LULUS', FAIL_SET);

    // Chart 2: per kategori
    const chart2 = document.createElement('div');
    chart2.className='panel'; chart2.style.marginBottom='18px';
    chart2.innerHTML = `
      <div class="chart-title">Pencapaian per Kategori Soal</div>
      <div class="chart-sub">Jumlah peserta lulus vs tidak lulus pada masing-masing modul.</div>
      <div class="iso-wrap"><div class="iso-chart" id="chart2"></div></div>
      <div class="legend"><div class="li"><span class="sw" style="background:var(--pass)"></span>Lulus</div><div class="li"><span class="sw" style="background:var(--fail)"></span>Tidak Lulus</div></div>`;
    contentEl.appendChild(chart2);
    let c2html = '';
    perKat.forEach(p=>{
      c2html += isoBar(p.lulus, maxKat, p.c.name.split(' ')[0], PASS_SET);
      c2html += isoBar(p.tidak, maxKat, p.c.name.split(' ')[0]+' (TL)', FAIL_SET);
    });
    chart2.querySelector('#chart2').innerHTML = c2html || '<div class="empty">Belum ada data.</div>';

    // Table
    const tablePanel = document.createElement('div');
    tablePanel.className='panel';
    const rows = filtered.slice().sort((a,b)=> b.tanggal.localeCompare(a.tanggal));
    tablePanel.innerHTML = `
      <div class="section-head">
        <div><div class="chart-title" style="margin-bottom:2px;">Data Hasil Ujian Peserta</div><div class="chart-sub" style="margin-bottom:0;">${rows.length} baris ditampilkan</div></div>
      </div>
      <div style="overflow-x:auto;">
      <table class="data-table">
        <thead><tr><th>Nama</th><th>NRP</th><th>Tanggal Ujian</th><th>Jenis Ujian</th><th>Nilai</th><th>Status</th><th>Perhitungan</th></tr></thead>
        <tbody>
        ${rows.length? rows.map(r=>`
          <tr>
            <td style="font-family:var(--font-body);">${escapeHtml(r.nama)}</td>
            <td>${escapeHtml(r.nrp)}</td>
            <td>${r.tanggal}</td>
            <td style="font-family:var(--font-body);">${r.kategoriNama}</td>
            <td>${r.skor}</td>
            <td><span class="badge ${r.lulus?'pass':'fail'}">${r.lulus?'Lulus':'Tidak Lulus'}</span></td>
            <td>${countedFiltered.has(r.id)?'<span class="badge pass" style="background:transparent;">Dihitung</span>':'<span class="badge muted">Diabaikan (retake)</span>'}</td>
          </tr>`).join('') : `<tr><td colspan="7"><div class="empty">Belum ada data ujian pada rentang filter ini.</div></td></tr>`}
        </tbody>
      </table>
      </div>`;
    contentEl.appendChild(tablePanel);
  }

  filtersEl.querySelector('#f-from').addEventListener('change', e=>{ state.from=e.target.value; draw(); });
  filtersEl.querySelector('#f-to').addEventListener('change', e=>{ state.to=e.target.value; draw(); });
  filtersEl.querySelector('#f-kat').addEventListener('change', e=>{ state.kategori=e.target.value; draw(); });
  filtersEl.querySelector('#f-status').addEventListener('change', e=>{ state.status=e.target.value; draw(); });
  filtersEl.querySelector('#f-reset').addEventListener('click', ()=>{
    state.from=''; state.to=''; state.kategori=''; state.status='';
    filtersEl.querySelector('#f-from').value=''; filtersEl.querySelector('#f-to').value='';
    filtersEl.querySelector('#f-kat').value=''; filtersEl.querySelector('#f-status').value='';
    draw();
  });

  draw();
  window.__dashboardGetData = ()=>{
    const filtered = getFiltered();
    const countedFiltered = computeCounted(filtered);
    return { filtered, countedFiltered };
  };
  return wrap;
}

function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ============================================================
   EXPORT TO PPT (elegant themed deck, native 3D bar charts)
   ============================================================ */
async function exportPPT(){
  const btn = document.getElementById('btn-export');
  const oldTxt = btn.textContent; btn.textContent='Membuat PPT…'; btn.disabled=true;
  try{
    if(typeof PptxGenJS === 'undefined'){
      throw new Error('Library PptxGenJS gagal dimuat dari CDN. Periksa koneksi internet lalu muat ulang halaman.');
    }
    const data = window.__dashboardGetData ? window.__dashboardGetData() : { filtered:RECORDS, countedFiltered:computeCounted(RECORDS) };
    const filtered = data.filtered;
    const countedIds = data.countedFiltered;
    const counted = filtered.filter(r=>countedIds.has(r.id));
    const totalLulus = counted.filter(r=>r.lulus).length;
    const totalTidak = counted.filter(r=>!r.lulus).length;
    const totalPeserta = new Set(filtered.map(r=>r.nama.trim().toLowerCase()+'|'+r.nrp.trim().toLowerCase())).size;
    const pct = counted.length ? Math.round((totalLulus/counted.length)*100) : 0;

    const NAVY='10151C', PANEL='161E28', AMBER='FFB020', GREEN='2FAE66', RED='E5484D', TEXT='EDEFF3', MUTED='8A94A3';

    const pptx = new PptxGenJS();
    pptx.defineLayout({ name:'WIDE', width:13.33, height:7.5 });
    pptx.layout = 'WIDE';

    // ---- Slide 1: Cover ----
    let s = pptx.addSlide();
    s.background = { color: NAVY };
    s.addShape('rect', { x:0, y:0, w:13.33, h:0.18, fill:{ color:AMBER } });
    s.addText('SIGAP K3', { x:0.6, y:2.2, w:8, h:0.9, fontFace:'Arial Black', fontSize:40, color:AMBER, bold:true });
    s.addText('DASHBOARD PELATIHAN & UJIAN KESELAMATAN KERJA', { x:0.6, y:3.0, w:10.5, h:0.6, fontFace:'Arial', fontSize:20, color:TEXT, bold:true });
    s.addText('Hand & Finger Injury · Power Tools · Lifting · Electrical · Welding · High Risk Activity', { x:0.6, y:3.6, w:10.5, h:0.5, fontFace:'Arial', fontSize:13, color:MUTED, italic:true });
    s.addText('Dicetak: ' + new Date().toLocaleDateString('id-ID',{day:'2-digit',month:'long',year:'numeric'}), { x:0.6, y:6.7, w:6, h:0.4, fontFace:'Arial', fontSize:11, color:MUTED });

    // ---- Slide 2: Ringkasan ----
    s = pptx.addSlide(); s.background={color:NAVY};
    s.addShape('rect', { x:0, y:0, w:13.33, h:0.12, fill:{color:AMBER} });
    s.addText('RINGKASAN PENCAPAIAN', { x:0.5, y:0.35, w:8, h:0.6, fontFace:'Arial', fontSize:26, color:TEXT, bold:true });
    const kpis = [
      ['Total Peserta', String(totalPeserta), TEXT],
      ['Ujian Terhitung', String(counted.length), TEXT],
      ['Lulus', String(totalLulus), GREEN],
      ['Tidak Lulus', String(totalTidak), RED],
      ['% Kelulusan', pct+'%', AMBER],
    ];
    let kx = 0.5;
    kpis.forEach(([lbl,val,col])=>{
      s.addShape('roundRect', { x:kx, y:1.3, w:2.3, h:1.5, fill:{color:PANEL}, line:{color:'2C3644',width:1}, rectRadius:0.08 });
      s.addText(val, { x:kx, y:1.5, w:2.3, h:0.8, align:'center', fontFace:'Arial', fontSize:32, bold:true, color:col });
      s.addText(lbl.toUpperCase(), { x:kx, y:2.25, w:2.3, h:0.4, align:'center', fontFace:'Arial', fontSize:10, color:MUTED });
      kx += 2.5;
    });

    // ---- Slide 3: Chart 3D pencapaian keseluruhan ----
    s = pptx.addSlide(); s.background={color:NAVY};
    s.addShape('rect', { x:0, y:0, w:13.33, h:0.12, fill:{color:AMBER} });
    s.addText('PENCAPAIAN KELULUSAN KESELURUHAN', { x:0.5, y:0.35, w:10, h:0.5, fontFace:'Arial', fontSize:22, color:TEXT, bold:true });
    s.addChart(pptx.ChartType.bar3D, [
      { name:'Jumlah Peserta', labels:['Lulus','Tidak Lulus'], values:[totalLulus, totalTidak] }
    ], {
      x:1.2, y:1.2, w:10.9, h:5.6,
      barDir:'col', chartColors:[GREEN, RED], showLegend:false, showValue:true,
      dataLabelColor:TEXT, catAxisLabelColor:TEXT, valAxisLabelColor:MUTED,
      chartArea:{fill:{color:NAVY}}, plotArea:{fill:{color:NAVY}},
      catAxisLineColor:'2C3644', valAxisLineColor:'2C3644', valGridLine:{color:'2C3644'}
    });

    // ---- Slide 4: Chart 3D per kategori ----
    const catLabels = CATEGORIES.map(c=>c.name.split(' ').slice(0,2).join(' '));
    const catLulus = CATEGORIES.map(c=> counted.filter(r=>r.kategoriId===c.id && r.lulus).length);
    const catTidak = CATEGORIES.map(c=> counted.filter(r=>r.kategoriId===c.id && !r.lulus).length);
    s = pptx.addSlide(); s.background={color:NAVY};
    s.addShape('rect', { x:0, y:0, w:13.33, h:0.12, fill:{color:AMBER} });
    s.addText('PENCAPAIAN PER KATEGORI SOAL', { x:0.5, y:0.35, w:10, h:0.5, fontFace:'Arial', fontSize:22, color:TEXT, bold:true });
    s.addChart(pptx.ChartType.bar3D, [
      { name:'Lulus', labels:catLabels, values:catLulus },
      { name:'Tidak Lulus', labels:catLabels, values:catTidak }
    ], {
      x:0.6, y:1.2, w:12.1, h:5.6,
      barDir:'col', barGrouping:'clustered', chartColors:[GREEN, RED], showLegend:true, legendColor:TEXT,
      dataLabelColor:TEXT, catAxisLabelColor:TEXT, valAxisLabelColor:MUTED, catAxisLabelFontSize:10,
      chartArea:{fill:{color:NAVY}}, plotArea:{fill:{color:NAVY}},
      catAxisLineColor:'2C3644', valAxisLineColor:'2C3644', valGridLine:{color:'2C3644'}
    });

    // ---- Slide(s) 5+: Tabel hasil ujian ----
    const rows = filtered.slice().sort((a,b)=> b.tanggal.localeCompare(a.tanggal));
    const header = [['Nama','NRP','Tanggal','Jenis Ujian','Nilai','Status'].map(t=>({text:t, options:{bold:true, color:'10151C', fill:{color:AMBER}, fontSize:10}}))];
    const chunk = 16;
    for(let i=0; i<Math.max(rows.length,1); i+=chunk){
      const part = rows.slice(i, i+chunk);
      s = pptx.addSlide(); s.background={color:NAVY};
      s.addShape('rect', { x:0, y:0, w:13.33, h:0.12, fill:{color:AMBER} });
      s.addText('DATA HASIL UJIAN PESERTA'+(rows.length>chunk?` (${Math.floor(i/chunk)+1})`:''), { x:0.5, y:0.3, w:10, h:0.5, fontFace:'Arial', fontSize:20, color:TEXT, bold:true });
      const body = part.length ? part.map(r=>[
        {text:r.nama, options:{color:TEXT, fontSize:10}},
        {text:r.nrp, options:{color:TEXT, fontSize:10}},
        {text:r.tanggal, options:{color:TEXT, fontSize:10}},
        {text:r.kategoriNama, options:{color:TEXT, fontSize:10}},
        {text:String(r.skor), options:{color:TEXT, fontSize:10}},
        {text:r.lulus?'LULUS':'TIDAK LULUS', options:{color:r.lulus?GREEN:RED, fontSize:10, bold:true}},
      ]) : [[{text:'Belum ada data.', options:{color:MUTED, fontSize:11, colspan:6}}]];
      s.addTable(header.concat(body), { x:0.5, y:1.0, w:12.3, autoPage:false, border:{type:'solid', color:'2C3644', pt:0.5}, fill:{color:PANEL} });
    }

    await pptx.writeFile({ fileName:'Dashboard_K3_Training.pptx' });
  }catch(err){
    console.error(err);
    alert('Gagal membuat file PPT: ' + err.message);
  }finally{
    btn.textContent = oldTxt; btn.disabled=false;
  }
}

/* ============================================================
   EXPORT TO WORD (lampiran nilai peserta + sertifikat kelulusan)
   ============================================================ */
const COMPANY_NAME = 'PT KALIMANTAN PRIMA PERSADA';
const APPROVAL_LEFT = 'SHE Coordinator';
const APPROVAL_RIGHT = 'Dept. Head Plant-SM';

async function exportWord(){
  const btn = document.getElementById('btn-export-word');
  const oldTxt = btn.textContent; btn.textContent='Membuat Word…'; btn.disabled=true;
  try{
    if(typeof docx === 'undefined'){
      throw new Error('Library docx gagal dimuat dari CDN. Periksa koneksi internet lalu muat ulang halaman.');
    }
    const data = window.__dashboardGetData ? window.__dashboardGetData() : { filtered:RECORDS, countedFiltered:computeCounted(RECORDS) };
    const rows = data.filtered.slice().sort((a,b)=> b.tanggal.localeCompare(a.tanggal));
    if(!rows.length){ alert('Belum ada data hasil ujian untuk diekspor.'); return; }

    const logoBuf = await fetch('assets/logo-kpp.png').then(r=>{
      if(!r.ok) throw new Error('Logo assets/logo-kpp.png tidak ditemukan.');
      return r.arrayBuffer();
    });

    const {
      Document, Packer, Paragraph, TextRun, Table, TableRow, TableCell, ImageRun,
      Header, AlignmentType, WidthType, BorderStyle, HeightRule, VerticalAlign,
      HeadingLevel, ShadingType
    } = docx;

    const NOBORDER = { top:{style:BorderStyle.NONE,size:0,color:'FFFFFF'}, bottom:{style:BorderStyle.NONE,size:0,color:'FFFFFF'}, left:{style:BorderStyle.NONE,size:0,color:'FFFFFF'}, right:{style:BorderStyle.NONE,size:0,color:'FFFFFF'} };
    const THINBORDER = { style:BorderStyle.SINGLE, size:4, color:'999999' };
    const GRIDBORDER = { top:THINBORDER, bottom:THINBORDER, left:THINBORDER, right:THINBORDER };

    function letterhead(subtitle){
      return new Table({
        width:{size:100, type:WidthType.PERCENTAGE},
        borders: NOBORDER,
        rows:[ new TableRow({ children:[
          new TableCell({ width:{size:18,type:WidthType.PERCENTAGE}, borders:NOBORDER, verticalAlign:VerticalAlign.CENTER,
            children:[ new Paragraph({ children:[ new ImageRun({ data:logoBuf, transformation:{width:56,height:56} }) ] }) ] }),
          new TableCell({ width:{size:64,type:WidthType.PERCENTAGE}, borders:NOBORDER, verticalAlign:VerticalAlign.CENTER,
            children:[
              new Paragraph({ alignment:AlignmentType.CENTER, children:[ new TextRun({ text:COMPANY_NAME, bold:true, size:30 }) ] }),
              new Paragraph({ alignment:AlignmentType.CENTER, children:[ new TextRun({ text:subtitle, size:19, color:'555555' }) ] })
            ] }),
          new TableCell({ width:{size:18,type:WidthType.PERCENTAGE}, borders:NOBORDER, children:[ new Paragraph('') ] })
        ] }) ]
      });
    }

    function hr(){
      return new Paragraph({ border:{ bottom:{ color:'C9A227', space:1, style:BorderStyle.SINGLE, size:10 } }, spacing:{ after:200 } });
    }

    function signatureBlock(tanggal){
      return new Table({
        width:{size:100, type:WidthType.PERCENTAGE},
        borders:NOBORDER,
        rows:[
          new TableRow({ children:[
            new TableCell({ width:{size:50,type:WidthType.PERCENTAGE}, borders:NOBORDER, children:[
              new Paragraph({ children:[ new TextRun({ text:'Diperiksa oleh,', size:20 }) ] }),
              new Paragraph({ children:[ new TextRun({ text:' ' }) ] }),
              new Paragraph({ children:[ new TextRun({ text:' ' }) ] }),
              new Paragraph({ children:[ new TextRun({ text:' ' }) ] }),
              new Paragraph({ border:{ bottom:{ color:'000000', space:1, style:BorderStyle.SINGLE, size:6 } }, children:[ new TextRun({ text:'                              ' }) ] }),
              new Paragraph({ children:[ new TextRun({ text:APPROVAL_LEFT, bold:true, size:20 }) ] }),
            ] }),
            new TableCell({ width:{size:50,type:WidthType.PERCENTAGE}, borders:NOBORDER, children:[
              new Paragraph({ alignment:AlignmentType.RIGHT, children:[ new TextRun({ text:'Disetujui oleh,', size:20 }) ] }),
              new Paragraph({ children:[ new TextRun({ text:' ' }) ] }),
              new Paragraph({ children:[ new TextRun({ text:' ' }) ] }),
              new Paragraph({ children:[ new TextRun({ text:' ' }) ] }),
              new Paragraph({ alignment:AlignmentType.RIGHT, border:{ bottom:{ color:'000000', space:1, style:BorderStyle.SINGLE, size:6 } }, children:[ new TextRun({ text:'                              ' }) ] }),
              new Paragraph({ alignment:AlignmentType.RIGHT, children:[ new TextRun({ text:APPROVAL_RIGHT, bold:true, size:20 }) ] }),
            ] }),
          ] })
        ]
      });
    }

    const today = new Date().toLocaleDateString('id-ID', { day:'2-digit', month:'long', year:'numeric' });

    // ---- Halaman 1: Lampiran daftar nilai seluruh peserta ----
    const tableHeaderCells = ['No','Nama','NRP','Jenis Ujian','Tanggal Ujian','Nilai','Status'];
    const headRow = new TableRow({
      tableHeader:true,
      children: tableHeaderCells.map(t=> new TableCell({
        borders:GRIDBORDER, shading:{ type:ShadingType.CLEAR, color:'auto', fill:'1B2431' }, verticalAlign:VerticalAlign.CENTER,
        children:[ new Paragraph({ alignment:AlignmentType.CENTER, children:[ new TextRun({ text:t, bold:true, color:'FFFFFF', size:18 }) ] }) ]
      }))
    });
    const bodyRows = rows.map((r,i)=> new TableRow({ children:[
      new TableCell({ borders:GRIDBORDER, children:[ new Paragraph({ alignment:AlignmentType.CENTER, children:[ new TextRun({ text:String(i+1), size:18 }) ] }) ] }),
      new TableCell({ borders:GRIDBORDER, children:[ new Paragraph({ children:[ new TextRun({ text:r.nama, size:18 }) ] }) ] }),
      new TableCell({ borders:GRIDBORDER, children:[ new Paragraph({ children:[ new TextRun({ text:r.nrp, size:18 }) ] }) ] }),
      new TableCell({ borders:GRIDBORDER, children:[ new Paragraph({ children:[ new TextRun({ text:r.kategoriNama, size:18 }) ] }) ] }),
      new TableCell({ borders:GRIDBORDER, children:[ new Paragraph({ alignment:AlignmentType.CENTER, children:[ new TextRun({ text:r.tanggal, size:18 }) ] }) ] }),
      new TableCell({ borders:GRIDBORDER, children:[ new Paragraph({ alignment:AlignmentType.CENTER, children:[ new TextRun({ text:String(r.skor), bold:true, size:18 }) ] }) ] }),
      new TableCell({ borders:GRIDBORDER, shading:{ type:ShadingType.CLEAR, color:'auto', fill:r.lulus?'E4F5EA':'FBE7E7' }, children:[ new Paragraph({ alignment:AlignmentType.CENTER, children:[ new TextRun({ text:r.lulus?'LULUS':'TIDAK LULUS', bold:true, color:r.lulus?'1F7A43':'B3261E', size:18 }) ] }) ] }),
    ] }));
    const resultsTable = new Table({ width:{size:100,type:WidthType.PERCENTAGE}, rows:[headRow, ...bodyRows] });

    const children = [
      letterhead('Lampiran Hasil Ujian & Nilai Peserta — Kompetensi K3'),
      hr(),
      new Paragraph({ alignment:AlignmentType.CENTER, spacing:{ after:60 }, children:[ new TextRun({ text:'LAMPIRAN HASIL UJIAN KOMPETENSI K3', bold:true, size:26 }) ] }),
      new Paragraph({ alignment:AlignmentType.CENTER, spacing:{ after:260 }, children:[ new TextRun({ text:'Tanggal Cetak: '+today, size:19, color:'555555' }) ] }),
      resultsTable,
      new Paragraph({ text:'', spacing:{ after:360 } }),
      signatureBlock(today),
    ];

    // ---- Halaman sertifikat kelulusan per peserta yang lulus ----
    const lulusRows = rows.filter(r=>r.lulus);
    lulusRows.forEach((r)=>{
      children.push(new Paragraph({ children:[ new docx.PageBreak() ] }));
      const certCell = new TableCell({
        borders:{ top:{style:BorderStyle.DOUBLE,size:14,color:'C9A227'}, bottom:{style:BorderStyle.DOUBLE,size:14,color:'C9A227'}, left:{style:BorderStyle.DOUBLE,size:14,color:'C9A227'}, right:{style:BorderStyle.DOUBLE,size:14,color:'C9A227'} },
        margins:{ top:400, bottom:400, left:500, right:500 },
        children:[
          letterhead('Sertifikat Kelulusan Uji Kompetensi K3'),
          new Paragraph({ text:'', spacing:{ after:200 } }),
          new Paragraph({ alignment:AlignmentType.CENTER, children:[ new TextRun({ text:'SERTIFIKAT KELULUSAN', bold:true, size:36, color:'8A5C10' }) ] }),
          new Paragraph({ alignment:AlignmentType.CENTER, spacing:{ after:260 }, children:[ new TextRun({ text:'Diberikan kepada:', italics:true, size:20 }) ] }),
          new Paragraph({ alignment:AlignmentType.CENTER, children:[ new TextRun({ text:r.nama.toUpperCase(), bold:true, size:34 }) ] }),
          new Paragraph({ alignment:AlignmentType.CENTER, spacing:{ after:260 }, children:[ new TextRun({ text:'NRP: '+r.nrp, size:20 }) ] }),
          new Paragraph({ alignment:AlignmentType.CENTER, spacing:{ after:60 }, children:[ new TextRun({ text:'Telah dinyatakan LULUS pada Ujian Kompetensi K3 dengan materi:', size:20 }) ] }),
          new Paragraph({ alignment:AlignmentType.CENTER, spacing:{ after:260 }, children:[ new TextRun({ text:r.kategoriNama, bold:true, size:26, color:'1F7A43' }) ] }),
          new Paragraph({ alignment:AlignmentType.CENTER, children:[ new TextRun({ text:'Nilai: '+r.skor+' / 100', bold:true, size:22 }) ] }),
          new Paragraph({ alignment:AlignmentType.CENTER, spacing:{ after:60 }, children:[ new TextRun({ text:'Tanggal Ujian: '+r.tanggal, size:20 }) ] }),
          new Paragraph({ alignment:AlignmentType.CENTER, spacing:{ after:420 }, children:[ new TextRun({ text:'No. Sertifikat: CERT-'+r.id.toUpperCase().slice(0,14), size:14, color:'888888' }) ] }),
          signatureBlock(today),
        ]
      });
      children.push(new Table({ width:{size:100,type:WidthType.PERCENTAGE}, rows:[ new TableRow({ children:[certCell] }) ] }));
    });

    const doc = new Document({
      sections: [{ properties:{}, children }]
    });

    const blob = await Packer.toBlob(doc);
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'Lampiran_Ujian_Sertifikat_K3.docx';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }catch(err){
    console.error(err);
    alert('Gagal membuat file Word: ' + err.message);
  }finally{
    btn.textContent = oldTxt; btn.disabled=false;
  }
}
